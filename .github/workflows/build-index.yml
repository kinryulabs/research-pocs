name: Build index
on:
  push:
    branches: [main]
    paths: ["**/metadata.yaml", "scripts/build_index.py", "TAXONOMY.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/build_index.py
      - name: Commit regenerated index
        run: |
          git config user.name  "index-bot"
          git config user.email "index-bot@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: rebuild index"
          git push
