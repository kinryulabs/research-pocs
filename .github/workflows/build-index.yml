name: Validate index
on:
  push:
    branches: [main]
    paths: ["**/metadata.yaml", "scripts/build_index.py", "TAXONOMY.md", "README.md"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Rebuild the index and confirm it is committed and tags are valid
        run: |
          python scripts/build_index.py
          if ! git diff --quiet -- README.md; then
            echo "::error::README.md is out of date. Run scripts/build_index.py and commit the result."
            git --no-pager diff -- README.md
            exit 1
          fi
